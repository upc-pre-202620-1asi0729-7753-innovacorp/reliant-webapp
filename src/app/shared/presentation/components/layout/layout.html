<mat-toolbar>
  <mat-toolbar-row>
    <img src="/reliant-logo.svg" alt="Reliant logo" class="logo"/>
    <h1>Reliant</h1>
    <div class="mat-spacer"></div>
    @for (option of options(); track option.label) {
      <a mat-button [routerLink]="option.link" routerLinkActive="active">{{ option.label }}</a>
    }
  </mat-toolbar-row>
</mat-toolbar>
<router-outlet/>
